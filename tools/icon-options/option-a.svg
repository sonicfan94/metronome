<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0EEE7"/>
      <stop offset="100%" stop-color="#E8E5DC"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F6F0"/>
      <stop offset="55%" stop-color="#ECE9E1"/>
      <stop offset="100%" stop-color="#D9D5C9"/>
    </linearGradient>
    <radialGradient id="cap" cx="42%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#FCFBF7"/>
      <stop offset="70%" stop-color="#EFEDE5"/>
      <stop offset="100%" stop-color="#E3E0D6"/>
    </radialGradient>
    <radialGradient id="reddot" cx="38%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#F0594B"/>
      <stop offset="100%" stop-color="#C5372C"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#paper)"/>

  <!-- recessed well -->
  <circle cx="512" cy="512" r="432" fill="#E4E1D8"/>
  <circle cx="512" cy="500" r="432" fill="#DAD6CB" filter="url(#soft2)" opacity="0.7"/>
  <circle cx="512" cy="514" r="430" fill="#E7E4DC"/>

  <!-- tempo ticks on the well, 300° sweep with a gap at the bottom -->
  <g stroke="#1C1B18" stroke-linecap="round">
    <line x1="512" y1="86"  x2="512" y2="134" stroke-width="12" opacity="0.55" transform="rotate(60 512 512)" stroke="#E6483B"/>
    <line x1="512" y1="92"  x2="512" y2="134" stroke-width="10" opacity="0.38" transform="rotate(-150 512 512)"/>
    <line x1="512" y1="100" x2="512" y2="128" stroke-width="7"  opacity="0.20" transform="rotate(-120 512 512)"/>
    <line x1="512" y1="100" x2="512" y2="128" stroke-width="7"  opacity="0.20" transform="rotate(-90 512 512)"/>
    <line x1="512" y1="100" x2="512" y2="128" stroke-width="7"  opacity="0.20" transform="rotate(-60 512 512)"/>
    <line x1="512" y1="92"  x2="512" y2="134" stroke-width="10" opacity="0.38" transform="rotate(-30 512 512)"/>
    <line x1="512" y1="100" x2="512" y2="128" stroke-width="7"  opacity="0.20" transform="rotate(0 512 512)"/>
    <line x1="512" y1="100" x2="512" y2="128" stroke-width="7"  opacity="0.20" transform="rotate(30 512 512)"/>
    <line x1="512" y1="100" x2="512" y2="128" stroke-width="7"  opacity="0.20" transform="rotate(90 512 512)"/>
    <line x1="512" y1="100" x2="512" y2="128" stroke-width="7"  opacity="0.20" transform="rotate(120 512 512)"/>
    <line x1="512" y1="92"  x2="512" y2="134" stroke-width="10" opacity="0.38" transform="rotate(150 512 512)"/>
  </g>

  <!-- knob drop shadow -->
  <ellipse cx="512" cy="552" rx="338" ry="330" fill="rgba(110,102,86,0.50)" filter="url(#soft)"/>

  <!-- machined rim -->
  <circle cx="512" cy="512" r="340" fill="url(#rim)"/>
  <circle cx="512" cy="512" r="340" fill="none" stroke="rgba(28,27,24,0.10)" stroke-width="2"/>
  <circle cx="512" cy="512" r="306" fill="none" stroke="rgba(28,27,24,0.07)" stroke-width="3"/>
  <circle cx="512" cy="512" r="288" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>

  <!-- raised cap -->
  <circle cx="512" cy="512" r="270" fill="url(#cap)"/>
  <circle cx="512" cy="512" r="270" fill="none" stroke="rgba(28,27,24,0.08)" stroke-width="2"/>

  <!-- red pointer, aimed at the 60° tick -->
  <g transform="rotate(60 512 512)">
    <line x1="512" y1="290" x2="512" y2="442" stroke="rgba(120,40,30,0.28)" stroke-width="46" stroke-linecap="round" transform="translate(0 9)"/>
    <line x1="512" y1="290" x2="512" y2="442" stroke="#E6483B" stroke-width="42" stroke-linecap="round"/>
  </g>
</svg>
